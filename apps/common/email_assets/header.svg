    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7449"/><stop offset="1" stop-color="#1F5E3B"/></linearGradient>
    <clipPath id="tunnel"><path d="M330 330 V215 C330 120 870 120 870 215 V330 Z"/></clipPath>
  </defs>
  <rect width="1200" height="400" fill="url(#sky)"/>

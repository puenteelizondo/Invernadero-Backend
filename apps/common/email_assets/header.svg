<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE7D3"/><stop offset="0.55" stop-color="#EAF4E6"/><stop offset="1" stop-color="#F7F3E3"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6"/><stop offset="0.55" stop-color="#FCE7A8"/><stop offset="1" stop-color="#FCE7A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#D7EBDA" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9CFAF"/><stop offset="1" stop-color="#8DBE96"/></linearGradient>

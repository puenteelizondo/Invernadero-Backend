name: invernadero

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+: el volumen se monta en /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    ports:
      # Solo accesible desde tu PC (127.0.0.1), para DBeaver/pgAdmin
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      # La imagen de Redis ya guarda snapshots RDB periódicos en /data por
      # su cuenta (lo ves en los logs: "Loading RDB produced by..."), pero
      # sin este volumen esos snapshots viven solo en la capa temporal del
      # contenedor: sobreviven un `restart`, pero se pierden con un `down`
      # o un `up --build` que lo recree. Con el volumen, el "último valor
      # conocido" de cada sensor y el estado de la política de persistencia
      # sobreviven aunque se recree el contenedor por completo.
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    volumes:
      # Tu carpeta del proyecto queda "espejada" en /app: editas y Django recarga
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
